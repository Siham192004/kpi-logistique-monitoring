name: CI/CD KPI Monitoring Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Créer le fichier .env
        run: |
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> .env
          echo "OPERATEUR_DEFAULT_PASSWORD=${{ secrets.OPERATEUR_DEFAULT_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "ALGORITHM=${{ secrets.ALGORITHM }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env

      - name: Builder les images Docker
        run: docker compose build

      - name: Tester le backend
        run: |
          docker compose up -d
          sleep 10
          curl -f http://localhost:8000/ || exit 1
          docker compose down

  deploy:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v3

      - name: Créer le fichier .env
        shell: powershell
        run: |
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" > .env
          echo "OPERATEUR_DEFAULT_PASSWORD=${{ secrets.OPERATEUR_DEFAULT_PASSWORD }}" >> .env
          echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> .env
          echo "ALGORITHM=${{ secrets.ALGORITHM }}" >> .env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" >> .env

      - name: Redémarrer Docker automatiquement
        shell: powershell
        run: |
          docker ps -q | ForEach-Object { docker stop $_ }
          docker compose down
          docker compose up -d --build