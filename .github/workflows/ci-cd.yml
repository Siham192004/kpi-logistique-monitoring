name: CI/CD KPI Monitoring Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer le fichier .env
        run: |
          cat > .env << EOF
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          OPERATEUR_DEFAULT_PASSWORD=${{ secrets.OPERATEUR_DEFAULT_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          EOF

      - name: Builder les images Docker
        run: docker compose build

      - name: Démarrer les conteneurs
        run: docker compose up -d

      - name: Vérifier les conteneurs
        if: always()
        run: docker compose ps

      - name: Afficher les logs du backend
        if: always()
        run: docker compose logs --tail=200 backend

      - name: Inspecter le healthcheck
        if: always()
        run: docker inspect kpi-logistique-monitoring-backend-1 --format='{{json .State.Health}}'

      - name: Attendre que le backend soit prêt
        run: |
          echo "Attente du backend..."
          for i in {1..30}; do
            if curl -sf http://localhost:8000/; then
              echo "✅ Backend prêt !"
              break
            fi
            echo "Tentative $i/30 — attente 5s..."
            sleep 5
          done

      - name: Tester le backend
        run: curl -f http://localhost:8000/

      - name: Arrêter les conteneurs
        run: docker compose down

  deploy:
    runs-on: self-hosted
    needs: build-and-test
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer le fichier .env
        shell: powershell
        run: |
          $content = "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}`nOPERATEUR_DEFAULT_PASSWORD=${{ secrets.OPERATEUR_DEFAULT_PASSWORD }}`nSECRET_KEY=${{ secrets.SECRET_KEY }}`nALGORITHM=${{ secrets.ALGORITHM }}`nACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}"
          [System.IO.File]::WriteAllText(".env", $content, [System.Text.Encoding]::UTF8)

      - name: Copier les données vers le dossier runner
        shell: powershell
        run: |
          $source = Join-Path $env:USERPROFILE "Desktop\Stage_PFA_2026\kpi-monitoring-platform\data"
          $dest = Join-Path $pwd "data"
          if (-not (Test-Path $dest)) { New-Item -ItemType Directory -Path $dest }
          Copy-Item "$source\*" "$dest\" -Force -Recurse

      - name: Redémarrer Docker
        shell: powershell
        run: |
          docker ps -q | ForEach-Object { docker stop $_ }
          docker compose down
          docker compose up -d --build

      - name: Attendre que le backend soit prêt
        shell: powershell
        run: |
          Write-Host "Attente du backend..."
          for ($i = 1; $i -le 30; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:8000/" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ Backend prêt !"
                break
              }
            } catch {
              Write-Host "Tentative $i/30 — attente 5s..."
              Start-Sleep -Seconds 5
            }
          }

      - name: Initialiser la base de données
        shell: powershell
        run: |
          docker exec kpi-logistique-monitoring-backend-1 python database/db.py