name: CI/CD KPI Monitoring Platform

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer le fichier .env
        run: |
          cat > .env << EOF
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          OPERATEUR_DEFAULT_PASSWORD=${{ secrets.OPERATEUR_DEFAULT_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ALGORITHM=${{ secrets.ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES=${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}
          EOF

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push image backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile     # ← vérifie le nom exact de ton Dockerfile
          push: true
          tags: harrouchasiham/kpi-backend:latest

      - name: Trigger Render Deploy
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "✅ Deploy Render déclenché !"