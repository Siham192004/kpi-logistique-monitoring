server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://kpi-backend-latest.onrender.com;
        proxy_http_version 1.1;

        # Important pour HTTPS vers Render
        proxy_ssl_server_name on;
        proxy_ssl_name kpi-backend-latest.onrender.com;

        # Important : le backend doit recevoir son propre Host
        proxy_set_header Host kpi-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/messages/ws/ {
        proxy_pass https://kpi-backend-latest.onrender.com/api/messages/ws/;
        proxy_http_version 1.1;

        # Important pour HTTPS / Render
        proxy_ssl_server_name on;
        proxy_ssl_name kpi-backend-latest.onrender.com;

        # WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host kpi-backend-latest.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}